version: 2
updates:
  # Monitor GitHub Actions for security updates and new versions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Monitor Ruby dependencies (Gemfile)
  - package-ecosystem: "bundler"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps"
      include: "scope"
    # Group Jekyll-related updates together and minor/patch for remaining gems
    groups:
      jekyll:
        patterns:
          - "jekyll*"
          - "github-pages"
          - "minimal-mistakes-jekyll"
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
